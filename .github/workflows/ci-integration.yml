name: CI Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install core test deps and chromadb for RAG tests
          pip install pytest pytest-asyncio fastapi[all] httpx prometheus_client chromadb opentelemetry-exporter-otlp-proto-grpc

      - name: Run unit and integration tests
        env:
          LLM_API_KEY: ''
          LLM_MODEL: ''
        run: |
          pytest -q
