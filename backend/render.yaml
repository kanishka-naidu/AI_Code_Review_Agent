services:
  - type: web
    name: ai-code-review-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    disk:
      name: reports
      mountPath: /opt/reports
      sizeGB: 1
    envVars:
      - key: REPORTS_DIR
        value: /opt/reports
